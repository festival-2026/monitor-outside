<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗点検 リアルタイム監視システム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      padding: 16px;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    /* 💡 横6列×縦4行のグリッドレイアウト設定 */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr); /* PC等では横6列 */
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 画面幅が狭い場合（タブレット・スマホ等）のレスポンシブ設定 */
    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(4, 1fr); /* 中画面: 横4列 */
      }
    }
    @media (max-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr); /* スマホ: 横2列 */
      }
    }

    /* カードスタイル */
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      transition: all 0.3s ease;
      border-top: 5px solid #ccc;
    }

    .card .title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card .status-text {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
      padding: 4px 6px;
      border-radius: 4px;
      text-align: center;
    }

    .card-buttons {
      display: flex;
      gap: 6px;
      flex-direction: column;
    }

    button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.8;
    }

    /* ステータス別デザイン */
    /* 1. 待機中 (waiting) */
    .status-waiting {
      border-top-color: #9e9e9e;
    }
    .status-waiting .status-text {
      background-color: #e0e0e0;
      color: #616161;
    }

    /* 2. 点検要請中 (requested) - 赤点滅 */
    .status-requested {
      border-top-color: #f44336;
      animation: pulse-red 1.2s infinite;
    }
    .status-requested .status-text {
      background-color: #ffebee;
      color: #c62828;
    }

    /* 3. 点検中 (inspecting) - 黄色 */
    .status-inspecting {
      border-top-color: #ff9800;
    }
    .status-inspecting .status-text {
      background-color: #fff3e0;
      color: #e65100;
    }

    /* 4. 点検完了 (completed) - 緑色 */
    .status-completed {
      border-top-color: #4caf50;
    }
    .status-completed .status-text {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    /* 赤点滅アニメーション */
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
    }

    .btn-start { background-color: #ff9800; color: white; }
    .btn-cancel { background-color: #9e9e9e; color: white; }
  </style>
</head>
<body>

  <h1>店舗点検 リアルタイム監視システム</h1>
  <div id="grid" class="grid"></div>

  <script>
    // ⚙️ GASのWebアプリURL（ご自身のデプロイURLに差し替えてください）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbypJR_DL9HnJMP2Lf1rZWFfzWASiOrH9nmD10GI0tU5LZFBlB6nleDzfrtsstJExaD7gw/exec";

    // 24店舗分の名前リスト
    const BOOTH_NAMES = [
      "1. 国語１年", "2. 社会科１年", "3. 数学１年", "4. 理科１年",
      "5. 音楽１年", "6. 美術１年", "7. 保健体育１年", "8. 技術家庭１年",
      "9. 英語１年", "10. 道徳１年", "11. 総合１年", "12. 特別支援１年",
      "13. 野球部", "14. サッカー部", "15. 陸上部", "16. 水泳部",
      "17. バスケット部", "18. バレー部", "19. 卓球部", "20. バドミントン部",
      "21. 吹奏楽部", "22. 美術部", "23. パソコン部", "24. 軟式野球部"
    ];

    // ステータスの表示名マップ
    const STATUS_LABELS = {
      'waiting': '待機中',
      'requested': '要請あり',
      'inspecting': '点検中',
      'completed': '完了'
    };

    // 初期化：24個のカードを動的生成
    function initGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (let i = 1; i <= 24; i++) {
        const card = document.createElement('div');
        card.className = 'card status-waiting';
        card.id = `card-${i}`;

        card.innerHTML = `
          <div>
            <div class="title">${BOOTH_NAMES[i - 1]}</div>
            <div class="status-text" id="status-text-${i}">待機中</div>
          </div>
          <div class="card-buttons" id="buttons-${i}">
            <!-- ボタンは動的に挿入されます -->
          </div>
        `;
        grid.appendChild(card);
      }
    }

    // サーバー（GAS）から最新ステータスを取得して同期
    async function syncStatuses() {
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();

        for (let i = 1; i <= 24; i++) {
          const status = data[String(i)] || 'waiting';
          updateCardUI(i, status);
        }
      } catch (err) {
        console.error("同期エラー:", err);
      }
    }

    // 各カードの表示更新
    function updateCardUI(boothNo, status) {
      const card = document.getElementById(`card-${boothNo}`);
      const statusText = document.getElementById(`status-text-${boothNo}`);
      const buttonsDiv = document.getElementById(`buttons-${boothNo}`);

      if (!card) return;

      // クラスのリセットと適用
      card.className = `card status-${status}`;
      statusText.textContent = STATUS_LABELS[status] || '待機中';

      // ステータスに応じたボタン制御
      buttonsDiv.innerHTML = '';
      if (status === 'requested') {
        buttonsDiv.innerHTML = `<button class="btn-start" onclick="handleStart(${boothNo})">点検開始</button>`;
      } else if (status === 'inspecting') {
        buttonsDiv.innerHTML = `<button class="btn-cancel" onclick="handleCancel(${boothNo})">キャンセル</button>`;
      }
    }

    // 「点検開始」ボタン押下処理
    async function handleStart(boothNo) {
      const name = BOOTH_NAMES[boothNo - 1];
      if (confirm(`「${name}」の点検を開始しますか？`)) {
        updateCardUI(boothNo, 'inspecting'); // 即時見た目を変更
        await fetch(`${GAS_URL}?action=update&booth=${boothNo}&status=inspecting`);
        syncStatuses();
      }
    }

    // 「キャンセル」ボタン押下処理
    async function handleCancel(boothNo) {
      const name = BOOTH_NAMES[boothNo - 1];
      if (confirm(`「${name}」の点検中ステータスを待機中に戻しますか？`)) {
        updateCardUI(boothNo, 'waiting'); // 即時見た目を変更
        await fetch(`${GAS_URL}?action=cancel&booth=${boothNo}`);
        syncStatuses();
      }
    }

    // 画面ロード時の初期化と定期更新（3秒ごと）
    window.onload = () => {
      initGrid();
      syncStatuses();
      setInterval(syncStatuses, 3000);
    };
  </script>
</body>
</html>
